<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>light_meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 단독 노출계 본체 — 흑연색 바디, 회녹색 반사형 LCD 표시부, 빨간 측광 버튼 */
:root{
  --body:#1b1d1c; --body-2:#262928; --line:#3a3e3c;
  --ink:#e9ece8; --ink-dim:#9aa19c;
  --lcd:#b9c2ae; --lcd-ink:#1d2219; --lcd-dim:#5d6655;
  --red:#d2412f; --red-text:#ff6a55; --ok:#7fb069; --warn:#e0a83a;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--body);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:17px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--body-2);border-radius:10px;padding:11px 14px;font-weight:500;cursor:pointer;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--body);border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:7px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,.field textarea,.inp{background:var(--body-2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--body-2)}
.muted{color:var(--ink-dim);font-size:13px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-dim)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.chip.me{color:var(--body);background:var(--warn);border-color:var(--warn);font-weight:600}
.over{color:var(--red-text)!important}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .title{flex:1;min-width:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>div{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink-dim);padding:5px 10px;font-size:12px;font-family:var(--f-num);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--body);font-weight:600}

/* 촬영 화면 */
#shoot .wrap{padding-block:10px 16px}
html,body{overflow-x:hidden}
/* 뷰파인더는 롤 포맷의 화면비(--ar = 가로/세로)를 따르고, 화면 높이의 46%를 넘지 않게 폭을 줄인다 */
/* 촬영 화면: 한 화면 고정. 뷰파인더 상자가 남는 높이를 다 쓰고, 그 안에서 포맷 비율을 유지 */
#shoot:not([hidden]){height:100%}
.shoot{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px 0}
.sbar{display:flex;align-items:center;gap:10px;flex:none}
.sbar .title{flex:1;min-width:0}
.icon-btn{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:18px;cursor:pointer}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollfilm{font-size:13px;color:var(--ink-dim)}
.finder-box{flex:1 1 auto;min-height:140px;container-type:size;display:flex;align-items:center;justify-content:center}
.finder{--ar:0.6667;position:relative;width:min(100%, calc(46svh * var(--ar)));aspect-ratio:var(--ar);border-radius:14px;overflow:hidden;background:#000;touch-action:manipulation}
@supports (width:1cqh){.finder{width:min(100cqw, calc(100cqh * var(--ar)))}}
.finder .status{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;max-width:70%}
html.native, html.native body{background:transparent}
html.native .finder{background:transparent}
.finder #photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder .manual-panel{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-dim);font-size:14px;line-height:1.6;
  background:repeating-linear-gradient(45deg,var(--body-2) 0 10px,var(--body) 10px 20px)}
.finder .manual-panel span{background:var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);max-width:26em}
.photo-actions{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92%;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.photo-actions .btn{white-space:nowrap}
.photo-note{background:rgba(0,0,0,.75);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.55;text-align:center}
.photo-note small{display:block;opacity:.65;font-family:var(--f-num);font-size:11px;margin-top:4px}
.photo-actions.top{top:46px;left:10px;transform:none;width:auto;align-items:flex-start}
.photo-actions.top .row{flex-wrap:nowrap;gap:6px}
.photo-actions.top .photo-note,.photo-actions.top #toManualBtn{display:none}
.photo-actions.top .btn{padding:5px 10px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.4)}
.finder .status #locChip{pointer-events:auto;cursor:pointer}
.finder .status .chip{font-size:10px;padding:1px 7px;background:rgba(0,0,0,.5);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick{display:grid;grid-template-columns:1fr 1fr auto 1.35fr;gap:8px;flex:none}
.qk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 9px;background:var(--body-2);height:42px;min-width:0;cursor:pointer}
.qk>span{font-family:var(--f-num);font-size:10px;letter-spacing:.08em;color:var(--ink-dim);flex:none}
.qk select{flex:1;min-width:0;width:100%;background:transparent;border:0;font-weight:600;font-size:15px;-webkit-appearance:none;appearance:none;padding:0;cursor:pointer}
.qk .ec-ico{width:19px;height:19px;flex:none;color:var(--ink-dim)}
.qk.mode{justify-content:space-between;font-size:13px}
.qk.mode b{min-width:0;font-weight:600}
.quick .me-toggle{height:42px}
.finder .orient{position:absolute;right:10px;top:10px;font-family:var(--f-num);font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:4px 8px;cursor:pointer}
.finder .fmt{position:absolute;right:10px;bottom:10px;font-family:var(--f-num);font-size:11px;color:rgba(255,255,255,.75);pointer-events:none}
.finder video{width:100%;height:100%;object-fit:cover;display:block}
.finder .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink-dim);font-size:14px}
.finder .tl{position:absolute;left:10px;top:10px;display:flex;gap:6px;align-items:center;z-index:4}
.meter-chip{font-family:var(--f-num);font-size:12px;font-weight:600;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:5px 9px;cursor:pointer}
.meter-chip::after{content:" ▾";opacity:.6;font-size:10px}
.finder .msg{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.finder .msg .detail{font-family:var(--f-num);font-size:11px;opacity:.7;word-break:break-all}
.finder .msg .help{font-size:13px;line-height:1.5;max-width:30em}
.reticle{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.reticle.cw{width:48%;height:auto;aspect-ratio:1;margin:0;transform:translate(-50%,-50%);border-style:dashed;border-color:rgba(255,255,255,.5)}
.reticle.avg{display:none}
.lcd{flex:none;background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:10px 13px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.25);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:end;min-width:0}
.lcd .k{font-size:10px;letter-spacing:.14em;color:var(--lcd-dim);font-family:var(--f-num)}
.lcd .ev{font-family:var(--f-num);font-size:clamp(26px,8.5vw,34px);font-weight:600;line-height:1}
.lcd .combo{font-family:var(--f-num);font-size:clamp(20px,6.6vw,28px);font-weight:600;line-height:1;text-align:right;white-space:nowrap;min-width:0}
.lcd .sub{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-family:var(--f-num);font-size:12px;color:var(--lcd-dim);border-top:1px solid rgba(29,34,25,.18);padding-top:6px;margin-top:4px;flex-wrap:wrap}
.lcd.held{outline:2px solid var(--lcd-ink);outline-offset:-4px}
.lcd{touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.lcd:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.lcd.dragging{box-shadow:inset 0 2px 10px rgba(0,0,0,.4)}
.strip{grid-column:1/-1;min-width:0;display:flex;justify-content:center;font-family:var(--f-num);font-size:12px;color:var(--lcd-dim);overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
  border-top:1px solid rgba(29,34,25,.18);padding-top:6px;margin-top:2px}
.strip span{flex:none;width:clamp(84px,26vw,104px);text-align:center;position:relative}
.strip span.on{color:var(--lcd-ink);font-weight:600}
.strip span.on::before{content:"";position:absolute;left:50%;top:-7px;width:0;height:0;border:4px solid transparent;border-top-color:var(--lcd-ink);transform:translateX(-50%)}
.strip span.void{visibility:hidden}
.lcd .shift{font-weight:600;color:var(--lcd-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;color:var(--ink-dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--body);font-weight:600}
.me-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.me-toggle{border:1px solid var(--line);background:transparent;color:var(--ink-dim);border-radius:10px;padding:8px 12px;font-family:var(--f-num);font-weight:600;cursor:pointer}
.me-toggle[aria-pressed="true"]{background:var(--warn);color:var(--body);border-color:var(--warn)}
.me-row select{background:var(--body-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
/* 셔터 줄은 화면 아래에 붙여서 스크롤하지 않고 누를 수 있게 */
.shutter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;padding-block:2px 10px}
.shutter-row .btn{min-width:84px}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid var(--ink);background:var(--ink);cursor:pointer;flex:none;box-shadow:0 0 0 4px var(--body) inset}
.shutter:active{transform:scale(.96)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 select{padding:9px 6px}
.prio-row{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px}
.prio-row .seg button{white-space:nowrap;padding-inline:4px}
.counter{flex:none;font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.counter small{display:block;font-size:11px;font-weight:400;color:var(--ink-dim)}

/* 바텀 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--body-2);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto}
.sheet .field input,.sheet .field select,.sheet .field textarea,.sheet .inp{background:var(--body)}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--body);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:30;max-width:90vw;text-align:center}
.toast.bad{background:var(--red);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--ink-dim);font-size:11px;letter-spacing:.08em}
tr.me-sub td:first-child{color:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 홈 -->
<section id="home"><div class="wrap stack">
  <div class="row">
    <div class="grow">
      <div class="label">light_meter</div>
      <h1 data-i18n="appSub"></h1>
    </div>
    <div class="lang" role="group" aria-label="Language"><button data-lang="ko">한</button><button data-lang="en">EN</button></div>
  </div>
  <div id="activeBox"></div>
  <button class="btn primary" id="newRollBtn" data-i18n="newRoll"></button>
  <div class="stack">
    <div class="row"><h2 class="grow" data-i18n="pastRolls"></h2><button class="btn small ghost" id="settingsBtn" data-i18n="meterSettings"></button></div>
    <div id="pastList"></div>
  </div>
</div></section>

<!-- 롤 설정 -->
<section id="setup" hidden><div class="wrap stack">
  <div class="topbar"><button class="btn small ghost" data-go="home" data-i18n="back"></button><h1 class="title" data-i18n="newRollTitle"></h1></div>
  <div class="field" id="presetField"><span class="label" data-i18n="loadPreset"></span><select id="presetSel"></select></div>
  <div class="grid2">
    <label class="field"><span class="label" data-i18n="format"></span><select id="fFormat"></select></label>
    <label class="field"><span class="label" data-i18n="frames"></span><input id="fFrames" type="number" inputmode="numeric" min="1" max="200"></label>
  </div>
  <label class="field"><span class="label" data-i18n="film"></span><input id="fFilm" data-i18n-ph="filmPh" list="filmList"></label>
  <datalist id="filmList">
    <option value="Kodak Portra 160"><option value="Kodak Portra 400"><option value="Kodak Portra 800">
    <option value="Kodak Gold 200"><option value="Kodak UltraMax 400"><option value="Kodak Ektar 100">
    <option value="Kodak Tri-X 400"><option value="Kodak T-Max 400"><option value="Fujifilm C200">
    <option value="Ilford HP5 Plus"><option value="Ilford FP4 Plus"><option value="Ilford Delta 3200">
    <option value="CineStill 800T"><option value="Kodak Ektachrome E100">
  </datalist>
  <div class="grid2">
    <label class="field"><span class="label" data-i18n="boxIso"></span><input id="fBoxIso" type="number" inputmode="numeric" min="1"></label>
    <label class="field"><span class="label" data-i18n="ei"></span><input id="fEi" type="number" inputmode="numeric" min="1"></label>
  </div>
  <div class="muted" id="pushNote"></div>
  <div class="grid2">
    <label class="field"><span class="label" data-i18n="rollNo"></span><input id="fRollNo" type="number" inputmode="numeric" min="1"></label>
    <label class="field"><span class="label" data-i18n="camera"></span><input id="fCamera" data-i18n-ph="cameraPh"></label>
  </div>
  <label class="field"><span class="label" data-i18n="lens"></span><input id="fLens" data-i18n-ph="lensPh"></label>
  <label class="field"><span class="label" data-i18n="note"></span><textarea id="fNote" rows="2" data-i18n-ph="notePh"></textarea></label>
  <label class="row muted"><input type="checkbox" id="fSavePreset"> <span data-i18n="savePreset"></span></label>
  <button class="btn red" id="startRollBtn" data-i18n="startRoll"></button>
</div></section>

<!-- 촬영 -->
<section id="shoot" hidden><div class="shoot">
  <div class="sbar">
    <button class="icon-btn" id="shootBack" data-i18n-aria="homeAria">←</button>
    <div class="title"><div class="label ell" id="rollTag">ROLL</div><div class="rollfilm ell" id="rollFilm"></div></div>
    <div class="counter" id="frameCounter">1/36</div>
  </div>
  <div class="finder-box"><div class="finder" id="finder">
    <video id="video" playsinline muted autoplay></video>
    <img id="photo" alt="" hidden>
    <div class="manual-panel" id="manualPanel" hidden><span data-i18n="manualPanel"></span></div>
    <div class="reticle" id="reticle"></div>
    <div class="photo-actions" id="photoActions" hidden>
      <div class="photo-note" id="photoNote" hidden></div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="photoBtn"></button>
        <button class="btn" id="photoLibBtn" data-i18n="photoLib"></button>
      </div>
      <button class="btn small" id="toManualBtn" data-i18n="toManual" hidden></button>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="photoLibInput" accept="image/*" hidden>
    <div class="tl"><button class="meter-chip" id="meterChip"></button><span class="chip me" id="meBadge" hidden></span></div>
    <button class="orient" id="orientBtn" data-i18n-aria="orientAria">⇄</button>
    <span class="fmt" id="fmtLabel"></span>
    <div class="status"><span id="metaChip" class="chip"></span><span id="locChip" class="chip"></span></div>
    <div class="msg" id="finderMsg">
      <span id="finderText"></span>
      <span class="help" id="finderHelp" hidden></span>
      <button class="btn primary" id="camRetry" hidden data-i18n="camTap"></button>
      <span class="detail" id="finderDetail" hidden></span>
    </div>
  </div></div>
  <div class="lcd" id="lcd" tabindex="0" role="slider" aria-valuemin="-20" aria-valuemax="20" aria-valuenow="0" data-i18n-aria="shiftAria">
    <div class="k">EV₁₀₀</div><div class="k" style="text-align:right" id="lcdIsoLabel">ISO 400</div>
    <div class="ev" id="lcdEv">--.-</div><div class="combo" id="lcdCombo">f/-- --</div>
    <div class="strip" id="lcdStrip" aria-hidden="true"></div>
    <div class="sub"><span id="lcdMode">LIVE</span><span class="shift" id="lcdShift"></span><span id="lcdDiff"></span><span id="lcdWarn"></span></div>
  </div>
  <div class="quick">
    <label class="qk"><svg class="ec-ico" viewBox="0 0 20 20" role="img" aria-label="Exposure compensation"><rect x="1.5" y="1.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 17.5 17.5 2.5" stroke="currentColor" stroke-width="1.3"/><path d="M4 6.5h5M6.5 4v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11 13.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><select id="ecSel" class="num"></select></label>
    <label class="qk"><span>ISO</span><select id="isoSel" class="num"></select></label>

const ratioLabel = r => r === 1 ? '1:1' : Math.abs(r - 1.5) < .01 ? '3:2' : Math.abs(r - 4/3) < .04 ? '4:3' : Math.abs(r - 1.25) < .01 ? '5:4' : r.toFixed(2) + ':1';
const AP_FULL  = [1,1.4,2,2.8,4,5.6,8,11,16,22,32,45,64];
const AP_THIRD = [1,1.1,1.2,1.4,1.6,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22,25,29,32,36,40,45,51,57,64];
const SH_FULL  = [1/8000,1/4000,1/2000,1/1000,1/500,1/250,1/125,1/60,1/30,1/15,1/8,1/4,1/2,1,2,4,8,15,30];
const SH_THIRD = [1/8000,1/6400,1/5000,1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,0.3,0.4,0.5,0.6,0.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30];
const fmtAp = n => 'f/' + (n < 10 && n % 1 ? n.toFixed(1) : String(n));
function fmtSh(t){
  if (t < 1 && (t < 0.3 || Math.abs(1 / t - Math.round(1 / t)) < 0.01)) return '1/' + Math.round(1 / t);
  return (t % 1 ? t.toFixed(1) : String(t)) + 's';
}
const log2 = Math.log2;

/* ---------- 노출 계산 (순수 함수) ---------- */
// 장면 EV100: 카메라가 실제로 쓴 노출 + (측광 영역 휘도 / 18% 중간회색)
function sceneEV({lum, meta, phoneN, offset, fallbackBase}){
  if (!(lum > 1e-5)) return -Infinity;
  const ratio = log2(lum / 0.18);
  if (meta) return log2(phoneN * phoneN / meta.t) - log2(meta.iso / 100) + ratio + offset;
  return fallbackBase + ratio;
}
// EV100, ISO, 우선 모드, 다중노출 보정(스톱) → 가장 가까운 표준값과 오차(+는 과다)
function solve({ev100, iso, prio, fixed, step, comp = 0}){
  const ev = ev100 + log2(iso / 100) + comp;
  const aps = step === 'third' ? AP_THIRD : AP_FULL;
  const shs = step === 'third' ? SH_THIRD : SH_FULL;
  if (prio === 'A'){
    const N = fixed, tIdeal = N * N / Math.pow(2, ev);
    let best = shs[0];
    for (const s of shs) if (Math.abs(log2(s / tIdeal)) < Math.abs(log2(best / tIdeal))) best = s;
    return {N, t: best, diff: log2(best / tIdeal)};
  }
  const t = fixed, nIdeal = Math.sqrt(t * Math.pow(2, ev));
  let best = aps[0];
  for (const a of aps) if (Math.abs(log2(a / nIdeal)) < Math.abs(log2(best / nIdeal))) best = a;
  return {N: best, t, diff: 2 * log2(nIdeal / best)};
}
// 프로그램 시프트: 우선 모드의 고정값을 단계 목록에서 shift칸 옮긴 뒤 같은 EV로 나머지를 다시 계산
function shiftedSolve({ev100, iso, prio, fixed, step, comp = 0, shift = 0}){
  const list = prio === 'A' ? (step === 'third' ? AP_THIRD : AP_FULL) : (step === 'third' ? SH_THIRD : SH_FULL);
  const i0 = list.reduce((bi, v, i) => Math.abs(log2(v / fixed)) < Math.abs(log2(list[bi] / fixed)) ? i : bi, 0);
  const i = Math.max(0, Math.min(list.length - 1, i0 + shift));
  return {...solve({ev100, iso, prio, fixed: list[i], step, comp}), shift: i - i0, index: i, len: list.length};
}
// 다음에 기록될 컷/노출 번호
function nextSlot(r){
  const maxF = r.shots.reduce((m, s) => Math.max(m, s.frame), 0);
  if (r.meOpen) return {frame: r.meOpen.frame, exposure: r.meOpen.count + 1};
  return {frame: maxF + 1, exposure: 0};
}
// 내보내기용: 컷 단위로 묶기
function groupFrames(shots){
  const map = new Map();
  for (const s of shots){
    if (!map.has(s.frame)) map.set(s.frame, []);
    map.get(s.frame).push(s);
  }
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(([frame, ex]) => {
    ex.sort((a, b) => (a.exposure || 1) - (b.exposure || 1));
    const multi = ex.length > 1 || ex.some(e => e.multi);
    return {frame, multipleExposure: multi, exposureCount: ex.length,
      exposures: ex.map(({frame, ...rest}) => rest)};
  });
}
window.__meter = {sceneEV, solve, shiftedSolve, nextSlot, groupFrames};

/* ---------- 유틸 ---------- */
function localISO(d){
  const p = n => String(n).padStart(2, '0');
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-', a = Math.abs(off);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${p(Math.floor(a/60))}:${p(a%60)}`;
}
let toastTimer;

const video = $('video');

let spot = {x:.5, y:.5};
let reading = null;

const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
const LIN = new Float32Array(256);
for (let i = 0; i < 256; i++){ const c = i / 255; LIN[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

const UA = navigator.userAgent;
const isIOS = /iP(hone|ad|od)/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const isMacSafari = !isIOS && /Macintosh/.test(UA) && /Safari/.test(UA) && !/Chrome|Chromium|Edg|Firefox/.test(UA);
const helpText = () => isIOS ? t('helpIos') : isMacSafari ? t('helpMac') : t('helpOther');
function finderState({text, help, retry, detail} = {}){
  $('finderMsg').hidden = !text;
  $('finderText').textContent = text || '';
  $('finderHelp').hidden = !help; $('finderHelp').textContent = help || '';
  $('camRetry').hidden = !retry;
  $('finderDetail').hidden = !detail; $('finderDetail').textContent = detail || '';
}
let opening = null;
function openCamera(){
  if (opening) return opening;
  opening = (async () => {
    finderState({text: t('camStarting')});
    if (!window.isSecureContext || location.protocol === 'file:'){ finderState({text: t('camInsecure')}); return false; }
    if (!navigator.mediaDevices?.getUserMedia){ finderState({text: t('camUnsupported'), help: helpText()}); return false; }
    // 사파리는 제약 조건에 까다로워서 점점 느슨하게 재시도
    const tries = [
      {video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:960}}, audio:false},
      {video:{facingMode:'environment'}, audio:false},
      {video:true, audio:false}
    ];
    let err = null;
    for (const c of tries){
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch (e){ err = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') break; }
    }
    if (!stream){
      const n = err?.name;
      const text = (n === 'NotAllowedError' || n === 'SecurityError') ? t('camDenied')
        : n === 'NotFoundError' ? t('camNotFound') : n === 'NotReadableError' ? t('camBusy') : t('camFail', err?.message || n);
      finderState({text, help: helpText(), retry: true, detail: `${n || 'Error'}: ${err?.message || ''}`});
      return false;
    }
    track = stream.getVideoTracks()[0];
    await tryManualExposure();
    video.muted = true; video.setAttribute('muted', ''); video.setAttribute('playsinline', '');
    video.srcObject = stream;
    try { await Promise.race([video.play(), new Promise(r => setTimeout(r, 1500))]); } catch {}
    await new Promise(r => setTimeout(r, 300));
    // iOS가 자동 재생을 막으면 탭해서 재생
    if (!video.videoWidth || video.paused) finderState({text: t('camNoFrames'), retry: true});
    else finderState();
    return true;
  })();
  return opening.finally(() => { opening = null; });
}
video.addEventListener('playing', () => { if (stream) finderState(); });
$('camRetry').addEventListener('click', async e => {
  e.stopPropagation();
  if (stream){
    try { await video.play(); } catch {}
    if (video.videoWidth && !video.paused){ finderState(); return; }
    stopShoot();
  }
  startShoot();
});

/* 측광 방식: auto면 안드로이드 등은 실시간, 아이폰·아이패드는 사진(EXIF) */
// Capacitor 앱 안에서 실행 중이면 Swift 플러그인(LightMeter)으로 카메라 노출값을 직접 받는다
const NATIVE_LM = window.Capacitor?.isNativePlatform?.() ? window.Capacitor?.Plugins?.LightMeter : null;
if (NATIVE_LM) document.documentElement.classList.add('native');
const method = () => {
  const m = settings.method || 'auto';
  if (m === 'native' && !NATIVE_LM) return isIOS ? 'photo' : 'live';
  return m === 'auto' ? (NATIVE_LM ? 'native' : isIOS ? 'photo' : 'live') : m;
};
const methodName = m => t({native:'mNative', live:'mLive', photo:'mPhoto', manual:'mManual'}[m]);
const offKey = () => method() === 'photo' ? 'photoOffset' : 'offset';   // 보정값은 방식별로 따로

async function startShoot(){
  const r = activeRoll(); if (!r){ show('home'); return; }
  meMode = meMode || !!r.meOpen;
  renderShootHeader(); renderControls(); renderMetaChip(null); renderLocChip();
  startGeo();
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  clearInterval(loopTimer); loopTimer = setInterval(measure, 180);
  const m = method();
  if (m !== 'native') stopNative();
  if (m === 'native'){ closeCamera(); finderState(); await startNative(); }
  else if (m === 'live'){ if (!stream) await openCamera(); }
  else {
    closeCamera();
    if (m === 'photo'){ loadExifr().catch(() => {}); finderState(); }
    else finderState();
  }
}
function closeCamera(){
  if (stream){ stream.getTracks().forEach(x => x.stop()); stream = null; track = null; video.srcObject = null; }
  manualExp = null;
}
/* ---------- 네이티브(아이폰 앱) 측광 ---------- */
let nativeExp = null, nativeOn = false, nativeSub = null;
function finderRect(){ const b = $('finder').getBoundingClientRect(); return {x: b.left, y: b.top, width: b.width, height: b.height}; }
async function startNative(){
  if (!NATIVE_LM) return;
  try {
    if (!nativeSub) nativeSub = await NATIVE_LM.addListener('exposure', d => { nativeExp = d; });
    await NATIVE_LM.start(finderRect());
    nativeOn = true; pointNative();
  } catch (e){ finderState({text: t('nativeFail', e?.message || e)}); }
}
function stopNative(){
  if (!nativeOn) return;
  nativeOn = false; nativeExp = null;
  NATIVE_LM?.stop().catch(() => {});
}
// 측광 위치: 스팟은 탭한 점, 중앙중점·평균은 화면 가운데 (아이폰 자동노출이 그 점을 기준으로 맞춘다)
function pointNative(){
  if (!nativeOn) return;
  const b = finderRect(), p = settings.meter === 'spot' ? spot : {x: .5, y: .5};
  NATIVE_LM.setPoint({x: b.x + p.x * b.width, y: b.y + p.y * b.height}).catch(() => {});
}
function stopShoot(){
  clearInterval(loopTimer); loopTimer = null;
  closeCamera(); stopNative();
  if (geoWatch != null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
  try { wakeLock?.release(); } catch {} wakeLock = null;
}
document.addEventListener('visibilitychange', () => { if ($('shoot').hidden) return; document.hidden ? stopShoot() : startShoot(); });

/* ---------- 위치 ---------- */
let geoErrCode = 0;   // 0 정상/대기, 1 권한, 2 신호 없음, 3 시간 초과, -1 미지원
function startGeo(){
  if (!navigator.geolocation){ geoErrCode = -1; renderLocChip(); return; }
  if (geoWatch != null) return;
  geoWatch = navigator.geolocation.watchPosition(
    p => { lastFix = p; geoErrCode = 0; renderLocChip(); },
    e => { geoErrCode = e.code || 2; renderLocChip(); },
    {enableHighAccuracy:true, maximumAge:30000, timeout:20000});
}
function renderLocChip(){
  const c = $('locChip');
  if (lastFix){ c.className = 'chip ok'; c.textContent = t('locAcc', Math.round(lastFix.coords.accuracy)); }
  else if (geoErrCode){ c.className = 'chip warn'; c.textContent = geoErrCode === 1 ? t('locDenied') : geoErrCode === 3 ? t('locTimeout') : geoErrCode === 2 ? t('locNoSignal') : t('locNo'); }
  else { c.className = 'chip'; c.textContent = t('locWait'); }
}
$('locChip').addEventListener('click', e => {
  e.stopPropagation();
  if (lastFix) return;
  $('locReason').textContent = geoErrCode === 1 ? t('locReasonDenied') : geoErrCode === 3 ? t('locReasonTimeout') : geoErrCode ? t('locReasonSignal') : '';
  $('locHelp').innerHTML = isIOS ? t('locHelpIos') : isMacSafari ? t('locHelpMac') : t('locHelpOther');
  $('locSheet').hidden = false;
});
$('locClose').onclick = () => $('locSheet').hidden = true;
$('locRetry').onclick = () => {
  $('locSheet').hidden = true;
  if (geoWatch != null){ navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
  geoErrCode = 0; renderLocChip();
  // 버튼 탭 안에서 직접 요청해야 권한 창이 다시 뜨는 브라우저가 있음
  navigator.geolocation?.getCurrentPosition(p => { lastFix = p; renderLocChip(); }, e => { geoErrCode = e.code || 2; renderLocChip(); }, {enableHighAccuracy:true, timeout:20000});
  startGeo();
};

/* ---------- 사진(EXIF) 측광 ---------- */
let photoMeta = null;
// APEX 표준은 EV100 = Bv + 5지만, 아이폰 Bv는 실측에서 1스톱가량 밝게 나와서 4를 쓴다.
// 2026-10-31 실측: 후지필름 디카 f/8 1/20 ISO400(EV100 8.3) vs 앱 Bv 4.6 → Bv+5 = 9.6 (+1.3), Bv+4 = 8.6 (+0.3)
const BV_TO_EV = 4;
const photoSmall = document.createElement('canvas');
let exifrPromise = null;
function loadExifr(){
  if (window.exifr) return Promise.resolve(window.exifr);
  if (exifrPromise) return exifrPromise;
  exifrPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js';
    s.onload = () => window.exifr ? res(window.exifr) : rej(new Error('exifr'));
    s.onerror = () => { exifrPromise = null; rej(new Error('exifr')); };
    document.head.appendChild(s);
  });
  return exifrPromise;
}
function renderMethodUI(){

  $('photoActions').classList.toggle('top', !!photoMeta);
  $('reticle').style.visibility = (m === 'manual' || (m === 'photo' && !photoMeta)) ? 'hidden' : '';
  if (m !== 'live') renderMetaChip(m === 'photo' ? photoMeta : null);
}
function photoNote(html){ $('photoNote').hidden = !html; $('photoNote').innerHTML = html || ''; }
$('photoActions').addEventListener('click', e => e.stopPropagation());
$('photoBtn').addEventListener('click', () => $('photoInput').click());
$('photoLibBtn').addEventListener('click', () => $('photoLibInput').click());
$('toManualBtn').addEventListener('click', () => {

  renderControls(); renderLcd(); toast(t('methodChanged', methodName('manual'))); startShoot();
});
$('photoInput').addEventListener('change', () => handlePhoto($('photoInput')));
$('photoLibInput').addEventListener('change', () => handlePhoto($('photoLibInput')));
async function handlePhoto(input){
  const f = input.files?.[0]; input.value = '';
  if (!f) return;
  photoNote(esc(t('photoReading'))); $('toManualBtn').hidden = true;
  let ex = null, loadErr = false;
  try { const exifr = await loadExifr(); ex = await exifr.parse(f); } catch (e){ loadErr = !window.exifr; }
  const img = $('photo');
  const old = img.getAttribute('src'); if (old) URL.revokeObjectURL(old);
  await new Promise(r => { img.onload = r; img.onerror = r; img.src = URL.createObjectURL(f); });
  // 매번 큰 사진을 그리지 않도록 작은 사본을 만들어 둔다
  const W = 320, H = Math.max(1, Math.round(W * img.naturalHeight / Math.max(1, img.naturalWidth)));
  photoSmall.width = W; photoSmall.height = H;
  photoSmall.getContext('2d').drawImage(img, 0, 0, W, H);
  const iso = [ex?.ISO, ex?.ISOSpeedRatings, ex?.PhotographicSensitivity].map(v => Array.isArray(v) ? v[0] : v).find(v => v > 0);
  const tt = ex?.ExposureTime, N = ex?.FNumber;
  reading = null;
  if (tt > 0 && N > 0 && iso > 0){
    const bv = typeof ex?.BrightnessValue === 'number' && isFinite(ex.BrightnessValue) ? ex.BrightnessValue : null;
    photoMeta = {t: tt, iso: +iso, N: +N, bv, photo: true, model: ex?.Model || ''};
    photoNote(''); renderMethodUI(); measure();
    toast(bv != null ? t('photoBv', bv.toFixed(1), (bv + BV_TO_EV).toFixed(1)) : t('photoMetered', fmtSh(tt), fmtAp(Math.round(N * 10) / 10), iso));
  } else {
    photoMeta = null; renderMethodUI(); renderLcd();
    const n = ex ? Object.keys(ex).length : 0;
    photoNote(loadErr ? esc(t('exifLoadFail'))
      : esc(t('photoNoExif')) + (isIOS ? ' ' + esc(t('photoNoExifIos')) : '') + `<small>${esc(f.type || 'image')} · ${esc(t('exifFound', n))}</small>`);
    $('toManualBtn').hidden = false;
  }
}
/* 노출 고정 측광: 카메라가 수동 노출을 받아주면 셔터·ISO를 우리가 정해 두고, 그 값으로 절대 EV를 계산.
   화면이 너무 밝거나 어두우면 셔터(→ISO)를 옮겨 다시 고정한다. */
let manualExp = null, settleUntil = 0;
const clampR = (v, r) => Math.min(r.max, Math.max(r.min, v));
async function tryManualExposure(){
  manualExp = null;
  if (settings.lockExposure === false || !track?.getCapabilities) return false;
  const caps = track.getCapabilities();
  if (!(caps.exposureMode || []).includes('manual') || !caps.exposureTime || !caps.iso) return false;
  const tU = clampR(10000 / 60, caps.exposureTime), iso = clampR(100, caps.iso);
  try {
    await track.applyConstraints({advanced:[{exposureMode:'manual', exposureTime:tU, iso}]});
    manualExp = {tU, iso, caps}; settleUntil = Date.now() + 600; return true;
  } catch { return false; }
}
function adaptExposure(mean){
  if (Date.now() < settleUntil) return true;
  if (mean > 0.04 && mean < 0.45) return false;
  const {caps} = manualExp;
  const f = Math.min(8, Math.max(1/8, 0.18 / Math.max(mean, 1e-4)));
  let tU = clampR(manualExp.tU * f, caps.exposureTime), iso = manualExp.iso;
  const rest = f / (tU / manualExp.tU);            // 셔터로 다 못 옮긴 만큼은 ISO로
  if (Math.abs(log2(rest)) > 0.3) iso = clampR(iso * rest, caps.iso);
  if (Math.abs(log2(tU / manualExp.tU)) < 0.05 && iso === manualExp.iso) return false;   // 한계에 닿음
  manualExp.tU = tU; manualExp.iso = iso; settleUntil = Date.now() + 600;
  track.applyConstraints({advanced:[{exposureMode:'manual', exposureTime:tU, iso}]}).catch(() => { manualExp = null; });
  return true;
}
function exposureMeta(){
  if (manualExp) return {t: manualExp.tU / 10000, iso: manualExp.iso, locked: true};
  if (!track?.getSettings) return null;
  const s = track.getSettings();
  // Image Capture 명세: exposureTime 단위는 100µs
  if (s.exposureTime > 0 && s.iso > 0) return {t: s.exposureTime / 10000, iso: s.iso};
  return null;
}
function renderMetaChip(meta){
  const c = $('metaChip'), m = method();
  if (m === 'native'){
    if (meta){ c.className = 'chip ok'; c.textContent = t('metaNative', fmtSh(meta.t), Math.round(meta.iso), fmtAp(Math.round(meta.N * 10) / 10)); }
    else { c.className = 'chip'; c.textContent = t('metaChecking'); }
    return;
  }
  if (m === 'manual'){ c.className = 'chip'; c.textContent = t('metaManual'); return; }
  if (m === 'photo'){
    if (meta){ c.className = 'chip ok'; c.textContent = t('metaPhoto', fmtSh(meta.t), Math.round(meta.iso), fmtAp(Math.round(meta.N * 10) / 10)); }
    else { c.className = 'chip'; c.textContent = t('metaPhotoWait'); }
    return;
  }
  if (meta){ c.className = 'chip ok'; c.textContent = (meta.locked ? 'LOCK · ' : '') + t('metaAbs', fmtSh(meta.t), Math.round(meta.iso)); }
  else if (reading){ c.className = 'chip warn'; c.textContent = t('metaCal'); }
  else { c.className = 'chip'; c.textContent = t('metaChecking'); }
}
// 측광 소스: 실시간이면 video, 사진 모드면 찍은 사진
function srcInfo(){
  if (method() === 'photo'){
    const img = $('photo');
    return {draw: photoSmall, w: $('finder').clientWidth, h: $('finder').clientHeight, vw: img.naturalWidth, vh: img.naturalHeight};
  }
  return {draw: video, w: video.clientWidth, h: video.clientHeight, vw: video.videoWidth, vh: video.videoHeight};
}
function toVideo(nx, ny){
  const {w, h, vw, vh} = srcInfo();
  const sc = Math.max(w / vw, h / vh), ox = (vw * sc - w) / 2, oy = (vh * sc - h) / 2;
  return {x: (nx * w + ox) / sc / vw, y: (ny * h + oy) / sc / vh};
}
function measure(){
  const m = method();
  if (m === 'manual' || !$('logSheet').hidden) return;
  if (m === 'native'){
    if (!nativeExp) return;
    // 아이폰 자동노출이 측광점에 맞춘 노출값 + 목표와의 차이(exposureTargetOffset)로 장면 EV를 구한다
    const d = nativeExp;
    const ev = log2(d.N * d.N / d.t) - log2(d.iso / 100) + (d.offset || 0) + (settings.offset || 0);
    reading = {lum: 0.18, ev, meta: {t: d.t, iso: d.iso, N: d.N, native: true}, clipFrac: 0, relToFrame: 0, mode: settings.meter};
    renderLcd(); renderMetaChip(reading.meta);
    return;
  }
  if (m === 'photo' && !photoMeta) return;
  const src = srcInfo();
  if (!src.vw || !src.w) return;
  const W = 160, H = Math.round(160 * src.vh / src.vw);
  canvas.width = W; canvas.height = H;
  ctx.drawImage(src.draw, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const mode = settings.meter;
  const tl = toVideo(0, 0), br = toVideo(1, 1);
  const c = mode === 'spot' ? toVideo(spot.x, spot.y) : toVideo(.5, .5);
  const cx = c.x * W, cy = c.y * H, minDim = Math.min((br.x - tl.x) * W, (br.y - tl.y) * H);
  const rSpot = minDim * 0.07, sig = minDim * 0.22;
  let sw = 0, sy = 0, clip = 0, cnt = 0, fw = 0, fy = 0;
  for (let y = Math.max(0, Math.floor(tl.y * H)); y < Math.min(H, Math.ceil(br.y * H)); y++){
    for (let x = Math.max(0, Math.floor(tl.x * W)); x < Math.min(W, Math.ceil(br.x * W)); x++){
      const i = (y * W + x) * 4, R = d[i], G = d[i+1], B = d[i+2];
      const Y = 0.2126 * LIN[R] + 0.7152 * LIN[G] + 0.0722 * LIN[B];
      fw++; fy += Y;
      const dx = x - cx, dy = y - cy, dd = dx*dx + dy*dy;
      const w = mode === 'spot' ? (dd <= rSpot * rSpot ? 1 : 0) : mode === 'cw' ? 0.25 + Math.exp(-dd / (2 * sig * sig)) : 1;
      if (w){ sw += w; sy += w * Y; cnt++; if (Math.max(R, G, B) >= 250) clip++; }
    }
  }
  if (!sw) return;
  if (m === 'live' && manualExp && adaptExposure(fy / fw)) return;
  const lum = sy / sw, meta = m === 'photo' ? photoMeta : exposureMeta();
  // 아이폰 사진은 HDR·야간 모드로 여러 장을 합성해서 셔터·ISO와 화면 밝기가 맞지 않는다.
  // 카메라가 직접 잰 장면 밝기(EXIF BrightnessValue, APEX Bv)가 있으면 EV100 = Bv + BV_TO_EV를 쓰고,
  // 스팟·중앙중점은 사진 평균 대비 상대 밝기만 더한다.
  const ev = (m === 'photo' && photoMeta.bv != null)
    ? photoMeta.bv + BV_TO_EV + (mode === 'avg' ? 0 : log2(lum / (fy / fw))) + (settings[offKey()] || 0)
    : sceneEV({lum, meta, phoneN: m === 'photo' ? photoMeta.N : settings.phoneN, offset: settings[offKey()] || 0, fallbackBase: settings.fallbackBase});
  reading = {lum, ev, meta, clipFrac: clip / cnt, relToFrame: log2(lum / (fy / fw)), mode};
  renderLcd(); renderMetaChip(meta);
}

/* ---------- 촬영: 표시부와 조작 ---------- */
const meCompStops = () => meMode && settings.meComp && settings.mePlan > 1 ? log2(settings.mePlan) : 0;
// solve()의 comp는 +일수록 노출을 줄인다. 노출 보정(EC)은 +일수록 밝게
const compStops = () => meCompStops() - (settings.ec || 0);
const fmtEc = v => Math.abs(v) < 0.05 ? '±0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1);
const ISO_LIST = [6,8,10,12,16,20,25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400];
let pShift = 0;   // 프로그램 시프트 (단계 수, +는 조리개 우선에서 조이기 / 셔터 우선에서 느리게)
function solveAt(k){
  const r = activeRoll(); if (!reading || !isFinite(reading.ev) || !r) return null;
  return shiftedSolve({ev100: reading.ev, iso: r.ei, prio: settings.prio, fixed: settings.prio === 'A' ? settings.apFixed : settings.shFixed,
    step: settings.step, comp: compStops(), shift: k});
}
function currentSolve(){
  const s = solveAt(pShift);
  if (s) pShift = s.shift;   // 목록 끝에서 멈추게
  return s;
}
function setShift(k, buzz){
  const s = solveAt(k); const next = s ? s.shift : k;
  if (next !== pShift){ pShift = next; if (buzz) try { navigator.vibrate?.(6); } catch {} }
  renderLcd();
}
function renderStrip(){
  const el = $('lcdStrip'), cur = currentSolve();
  if (!cur){ el.innerHTML = ''; return; }
  let html = '';
  for (let k = pShift - 2; k <= pShift + 2; k++){
    const s = solveAt(k), valid = s && s.shift === k;
    html += `<span class="${k === pShift ? 'on' : valid ? '' : 'void'}">${valid ? `${fmtAp(s.N)} ${fmtSh(s.t)}` : '·'}</span>`;
  }
  el.innerHTML = html;
  $('lcd').setAttribute('aria-valuenow', pShift);
  $('lcd').setAttribute('aria-valuetext', `${fmtAp(cur.N)} ${fmtSh(cur.t)}`);
}
function renderLcd(){
  const r = activeRoll(); if (!r) return;
  $('lcdIsoLabel').textContent = 'ISO ' + r.ei + (settings.ec ? ` · EC ${fmtEc(settings.ec)}` : '') + (meCompStops() ? ` · ME −${meCompStops().toFixed(1)}` : '');
  if (method() === 'manual'){
    $('lcdEv').textContent = '--.-'; $('lcdCombo').textContent = 'MANUAL'; $('lcdStrip').innerHTML = '';
    $('lcdShift').textContent = ''; $('lcdDiff').textContent = ''; $('lcdWarn').textContent = ''; $('lcdMode').textContent = 'MANUAL';
    return;
  }
  if (!reading || !isFinite(reading.ev)){ $('lcdMode').textContent = method() === 'photo' ? 'PHOTO' : 'LIVE'; $('lcdEv').textContent = reading ? 'LOW' : '--.-'; $('lcdCombo').textContent = '--'; $('lcdDiff').textContent = ''; $('lcdStrip').innerHTML = ''; $('lcdShift').textContent = ''; return; }
  $('lcdEv').textContent = (reading.ev >= 0 ? '' : '−') + Math.abs(reading.ev).toFixed(1);
  const s = currentSolve();
  renderStrip();
  $('lcdShift').textContent = pShift ? `P${pShift > 0 ? '+' : '−'}${Math.abs(pShift)}` : '';
  $('lcdCombo').textContent = `${fmtAp(s.N)} ${fmtSh(s.t)}`;
  const d = Math.round(s.diff * 10) / 10;
  $('lcdDiff').textContent = Math.abs(d) < 0.15 ? '±0' : (d > 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' EV';
  if (!$('lcd').classList.contains('held'))
    $('lcdMode').textContent = {spot:'SPOT', cw:'CW', avg:'AVG'}[reading.mode] +
      (reading.mode === 'spot' ? ` ${reading.relToFrame >= 0 ? '+' : '−'}${Math.abs(reading.relToFrame).toFixed(1)} ${t('vsFrame')}` : '');
  $('lcdWarn').textContent = reading.clipFrac > 0.2 ? t('clipW') : reading.lum < 0.002 ? t('darkW') : '';
}
function renderShootHeader(){
  const r = activeRoll(); if (!r) return;
  $('rollTag').textContent = `ROLL ${r.rollNo} · ${formatOf(r)}`;
  $('rollFilm').textContent = [r.film || t('noFilm'), r.camera].filter(Boolean).join(' · ');
  const s = nextSlot(r);
  $('frameCounter').innerHTML = counterHTML(r) + (meMode ? `<small>${t('meBadge', s.exposure || 1, settings.mePlan)}</small>` : '');
  const ratio = FORMAT_RATIO[r.format] || 1.5, land = !!settings.finderLandscape && ratio !== 1;
  $('finder').style.setProperty('--ar', (land ? ratio : 1 / ratio).toFixed(4));
  if (nativeOn) requestAnimationFrame(() => NATIVE_LM.setFrame(finderRect()).catch(() => {}));
  $('orientBtn').hidden = ratio === 1;
  $('fmtLabel').textContent = ratio === 1 ? '1:1' : land ? ratioLabel(ratio) : ratioLabel(ratio).split(':').reverse().join(':').replace('1:', '1:');

  $('meBadge').textContent = t('meBadge', s.exposure || 1, settings.mePlan);
}
function renderControls(){
  document.querySelectorAll('#meterSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === settings.meter));
  document.querySelectorAll('#prioSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === settings.prio));
  const list = settings.prio === 'A' ? (settings.step === 'third' ? AP_THIRD : AP_FULL) : (settings.step === 'third' ? SH_THIRD : SH_FULL);
  const cur = settings.prio === 'A' ? settings.apFixed : settings.shFixed;
  const near = list.reduce((b, v) => Math.abs(log2(v / cur)) < Math.abs(log2(b / cur)) ? v : b, list[0]);

  }

    : `${settings.prio === 'A' ? 'A ' + fmtAp(settings.apFixed) : 'S ' + fmtSh(settings.shFixed)} · ${{spot:'SPOT', cw:'CW', avg:'AVG'}[settings.meter]}`;
  const sel = settings.method || 'auto';
  document.querySelectorAll('#methodSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === sel));
  $('methodNote').textContent = sel === 'auto' ? t('methodAuto', methodName(m)) + ' ' + t('methodDesc')[m] : t('methodDesc')[m];

/* 프로그램 시프트: 리드아웃 드래그 */
(() => {
  const lcd = $('lcd'), STEP_PX = 58, DEAD_PX = 14;
  let drag = null, lastTap = 0;
  lcd.addEventListener('pointerdown', e => {
    if (lcd.classList.contains('held')) return;
    drag = {x: e.clientX, start: pShift, moved: false, id: e.pointerId};
    lcd.setPointerCapture(e.pointerId); lcd.classList.add('dragging');
  });
  lcd.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 6) drag.moved = true;
    // 손가락을 왼쪽으로 밀면 오른쪽 조합이 가운데로 온다
    const eff = Math.sign(dx) * Math.max(0, Math.abs(dx) - DEAD_PX);
    setShift(drag.start - Math.round(eff / STEP_PX), true);
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    lcd.classList.remove('dragging');
    if (!drag.moved){
      const now = Date.now();
      if (now - lastTap < 320 && pShift){ setShift(0); toast(t('shiftReset')); }
      lastTap = now;
    }
    drag = null;
  };
  lcd.addEventListener('pointerup', end);
  lcd.addEventListener('pointercancel', end);
  lcd.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ setShift(pShift + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft'){ setShift(pShift - 1); e.preventDefault(); }
    else if (e.key === 'Home' || e.key === 'Escape'){ setShift(0); e.preventDefault(); }
  });
})();

/* ---------- 셔터 → 기록 시트 ---------- */
let held = null;
$('shutterBtn').onclick = () => {

function getFix(){
  if (lastFix && Date.now() - lastFix.timestamp < 120000) return Promise.resolve(lastFix);
  if (!navigator.geolocation) return Promise.resolve(null);
  return new Promise(res => navigator.geolocation.getCurrentPosition(res, () => res(lastFix), {enableHighAccuracy:true, timeout:6000, maximumAge:60000}));
}
$('logYes').onclick = async () => {

  }

    <div class="grid2 muted">
      <div>${t('boxIso')} <b class="num">${r.boxIso}</b> · EI <b class="num">${r.ei}</b>${push}</div>
      <div>${esc(r.camera || t('noCamera'))}</div>
      <div>${esc(r.lens || t('noLens'))}</div>
      <div class="num">${esc(r.startedAt.slice(0,16).replace('T',' '))}</div>
    </div>${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}`;
  const meFrames = new Set(groupFrames(r.shots).filter(g => g.multipleExposure).map(g => g.frame));
  $('shotRows').innerHTML = r.shots.length ? r.shots.map((s, i) => {
    const isMe = meFrames.has(s.frame);
    return `<tr class="${isMe && s.exposure > 1 ? 'me-sub' : ''}">
      <td class="num ${s.frame > r.frames ? 'over' : ''}">${s.frame}${isMe ? `<span style="color:var(--warn)">-${s.exposure}</span>` : ''}</td>
      <td class="num">${fmtAp(s.aperture)}</td><td class="num">${esc(s.shutterLabel)}</td>
      <td class="num">${s.meteredEV100 ?? '–'}</td><td class="num">${esc(s.time.slice(11,16))}</td>
      <td class="num">${[s.place ? esc(s.place) : '', s.lat != null ? s.lat.toFixed(4) + ', ' + s.lon.toFixed(4) : ''].filter(Boolean).join(' · ') || '–'}</td>
      <td>${esc(s.lens)}</td><td>${esc(s.note)}</td>
      <td><button class="btn small ghost" data-del="${i}">${t('del')}</button></td></tr>`;
  }).join('') : `<tr><td colspan="9" class="muted">${t('noShots')}</td></tr>`;
  $('shotRows').querySelectorAll('[data-del]').forEach(b => b.onclick = () => askDelete('shot', +b.dataset.del));
  $('finishBtn').hidden = !!r.endedAt;
  $('resumeBtn').hidden = !r.endedAt || !!activeRoll();
  let canShareFiles = false;
  try { canShareFiles = !!(navigator.canShare && navigator.canShare({files:[new File(['x'], 'x.json', {type:'application/json'})]})); } catch {}
  $('shareBtn').hidden = !canShareFiles;
}
$('reviewBack').onclick = () => { const r = rolls.find(x => x.id === reviewId); show(r && !r.endedAt ? 'shoot' : 'home'); };
$('finishBtn').onclick = () => openEnd(false);
$('resumeBtn').onclick = () => { const r = rolls.find(x => x.id === reviewId); r.endedAt = null; saveRolls(); show('shoot'); };
$('deleteRollBtn').onclick = () => askDelete('roll');

let pendingDel = null;
function askDelete(kind, idx){
  const r = rolls.find(x => x.id === reviewId);
  pendingDel = {kind, idx};
  if (kind === 'roll') $('delText').textContent = t('delRoll', rollLabel(r), r.shots.length);
  else { const s = r.shots[idx]; $('delText').textContent = t('delShot', t('frameLabel', s.frame, s.multi ? s.exposure : 0)); }
  $('delSheet').hidden = false;
}
$('delCancel').onclick = () => $('delSheet').hidden = true;
$('delConfirm').onclick = () => {
  $('delSheet').hidden = true;
  if (pendingDel.kind === 'roll'){ rolls = rolls.filter(x => x.id !== reviewId); saveRolls(); show('home'); toast(t('rollDeleted')); }
  else {
    const r = rolls.find(x => x.id === reviewId), s = r.shots[pendingDel.idx];
    r.shots.splice(pendingDel.idx, 1);
    if (r.meOpen && r.meOpen.frame === s.frame){
      const left = r.shots.filter(x => x.frame === s.frame).length;
      r.meOpen = left ? {frame: s.frame, count: left} : null;
    }
    saveRolls(); renderReview();
  }
};

function exportData(r){
  return {
    schema: 'light_meter/2',
    roll: {rollNo:r.rollNo, format:r.format, formatName:fmtName(FORMATS.find(f => f.id === r.format)) || r.format, frames:r.frames,
           film:r.film, boxIso:r.boxIso, ei:r.ei, camera:r.camera, lens:r.lens, note:r.note, startedAt:r.startedAt, endedAt:r.endedAt},
    frames: groupFrames(r.shots)
  };
}
function toCsv(r){
  const cols = ['roll','frame','exposure','multiple_exposure','time','film','ei','camera','lens','aperture','shutter','shutter_s','metered_ev100','ec_ev','me_comp_ev','meter_mode','meter_source','place','lat','lon','alt','accuracy_m','note'];
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const meFrames = new Set(groupFrames(r.shots).filter(g => g.multipleExposure).map(g => g.frame));
  const rows = r.shots.map(s => [r.rollNo, s.frame, s.exposure, meFrames.has(s.frame), s.time, r.film, s.iso, r.camera, s.lens, s.aperture, s.shutterLabel,
    +s.shutter.toPrecision(6), s.meteredEV100, s.ecEV ?? 0, s.meCompEV, s.meterMode, s.meterSource, s.place, s.lat, s.lon, s.alt, s.accuracy, s.note].map(q).join(','));
  return '﻿' + [cols.join(','), ...rows].join('\n');
}
const fileName = (r, ext) => `roll${String(r.rollNo).padStart(3,'0')}_${(r.film || 'film').replace(/[^\w가-힣-]+/g, '-')}_${r.startedAt.slice(0,10)}.${ext}`;
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(t('saved', name));
}
$('expJson').onclick = () => { const r = rolls.find(x => x.id === reviewId); download(fileName(r, 'json'), JSON.stringify(exportData(r), null, 2), 'application/json'); };
$('expCsv').onclick = () => { const r = rolls.find(x => x.id === reviewId); download(fileName(r, 'csv'), toCsv(r), 'text/csv'); };
$('shareBtn').onclick = async () => {
  const r = rolls.find(x => x.id === reviewId);
  const files = [new File([JSON.stringify(exportData(r), null, 2)], fileName(r, 'json'), {type:'application/json'}),
                 new File([toCsv(r)], fileName(r, 'csv'), {type:'text/csv'})];
  try { await navigator.share({files, title: rollLabel(r)}); } catch (e){ if (e.name !== 'AbortError') toast(t('shareFail'), true); }
};

/* ---------- 설정 / 보정 ---------- */
// 기기 모델로 폰 메인 카메라 조리개 자동 입력 (안드로이드 Chrome의 User-Agent Client Hints)
const PHONE_N = [
  [/SM-S9(18|28|38)/, 'Galaxy S Ultra', 1.7],
  [/SM-S9\d\d/, 'Galaxy S', 1.8],
  [/SM-F\d{3}/, 'Galaxy Z', 1.8],
  [/SM-[AM]\d{3}/, 'Galaxy A', 1.8],
  [/Pixel/, 'Pixel', 1.7],
];
let device = null;
(async () => {
  try {
    const ud = navigator.userAgentData;
    if (!ud?.getHighEntropyValues) return;
    const {model} = await ud.getHighEntropyValues(['model']);
    if (!model) return;
    const hit = PHONE_N.find(([re]) => re.test(model));
    device = {model, n: hit ? hit[2] : null};
    if (device.n && !settings.phoneNManual){ settings.phoneN = device.n; saveSettings(); }
  } catch {}
})();
function openSettings(){
  const meta = exposureMeta();
  const devLine = isIOS ? t('devIos') : device?.n ? t('devAuto', device.model, device.n) : '';
  let capsLine = '';
  try {
    const c = track?.getCapabilities?.();
    if (c) capsLine = t('capsLine', [`exposureMode [${(c.exposureMode || []).join(', ') || '–'}]`, `exposureTime ${c.exposureTime ? '✓' : '✗'}`, `iso ${c.iso ? '✓' : '✗'}`].join(' · '));
  } catch {}
  $('setMeta').textContent = [track ? (manualExp ? t('lockOn') : meta ? t('setMetaAbs') : t('setMetaCal')) : t('setMetaNone'), devLine, capsLine].filter(Boolean).join('\n');
  const opt = (list, f, cur) => list.map((v, i) => `<option value="${i}" ${v === cur ? 'selected' : ''}>${f(v)}</option>`).join('');
  if (!$('dAp').options.length){
    $('dAp').innerHTML = opt(AP_THIRD, fmtAp, 8); $('dSh').innerHTML = opt(SH_THIRD, fmtSh, 1/125); $('dIso').innerHTML = opt(ISO_LIST, String, 100);
  }
  $('setMeta').style.whiteSpace = 'pre-line';
  $('sPhoneN').value = settings.phoneN; $('sStep').value = settings.step; $('sOffset').value = settings[offKey()] || 0; $('sRef').value = '';
  $('sCal').disabled = $('sCamCal').disabled = $('sSunny').disabled = !reading;
  $('setSheet').hidden = false;
}
$('sCal').onclick = () => {
  measure();   // 지금 측광 방식으로 새로 잰 값에 맞춘다
  const ref = parseFloat($('sRef').value);
  if (!isFinite(ref) || !reading || !isFinite(reading.ev)){ toast(t('calNeed'), true); return; }
  if (reading.meta){ const k = offKey(); settings[k] = Math.round(((settings[k] || 0) + ref - reading.ev) * 10) / 10; $('sOffset').value = settings[k]; }
  else settings.fallbackBase = Math.round((settings.fallbackBase + ref - reading.ev) * 10) / 10;
  saveSettings(); toast(t('calDone'));
};
$('sSunny').onclick = () => { $('sRef').value = 15; $('sCal').click(); };
$('sCamCal').onclick = () => {
  const N = AP_THIRD[+$('dAp').value], tt = SH_THIRD[+$('dSh').value], iso = ISO_LIST[+$('dIso').value];
  $('sRef').value = (log2(N * N / tt) - log2(iso / 100)).toFixed(1);
  $('sCal').click();
};
$('setClose').onclick = () => {
  const n = parseFloat($('sPhoneN').value) || 1.8;
  if (n !== settings.phoneN) settings.phoneNManual = true;
  settings.phoneN = n;
  settings[offKey()] = parseFloat($('sOffset').value) || 0;
  if (settings.step !== $('sStep').value) pShift = 0;
  settings.step = $('sStep').value;
  saveSettings(); $('setSheet').hidden = true; renderControls(); renderLcd();
};
$('shootSettings').onclick = openSettings;

applyLang();
show('home');
</script>
